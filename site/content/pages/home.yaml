id: home
title: home
hero:
  heading: "rs-learn"
  subheading: "// continual-learning primitives · wasm cdylib · plugkit host"
  body: "continual-learning primitives for LLM agents, shipped as a small wasm cdylib that runs inside a host providing key-value storage and vector search via a handful of imports. this crate is the algorithm layer — the host owns io, scheduling, embedding, and agent transport."
  badges:
    - { label: "rust" }
    - { label: "wasm32-wasip1" }
    - { label: "libsql host" }
    - { label: "fastgrnn" }
    - { label: "ewc++" }
    - { label: "lora" }
    - { label: "bi-temporal graph" }
  ctas:
    - { label: "github", href: "https://github.com/AnEntrypoint/rs-learn", primary: true }
    - { label: "npm", href: "https://www.npmjs.com/package/@anentrypoint/rs-learn-wasm" }
    - { label: "247420", href: "https://247420.xyz" }

quickstart:
  heading: "host contract"
  lines:
    - { kind: "cmt", text: "host imports (six functions)" }
    - { kind: "cmd", text: "host_kv_get(ns, key) -> u64          // packed ptr+len" }
    - { kind: "cmd", text: "host_kv_put(ns, key, val) -> u32      // nonzero = ok" }
    - { kind: "cmd", text: "host_kv_query(ns, query) -> u64        // json array of matches" }
    - { kind: "cmd", text: "host_vec_search(query, k) -> u64" }
    - { kind: "cmd", text: "host_log(level, msg) -> u32" }
    - { kind: "cmd", text: "host_now_ms() -> i64" }
    - { kind: "cmt", text: "wasm exports" }
    - { kind: "cmd", text: "rs_learn_alloc(len) -> *mut u8" }
    - { kind: "cmd", text: "rs_learn_dispatch(ptr, len) -> u64     // packed json response" }
    - { kind: "cmt", text: "build from source" }
    - { kind: "cmd", text: "cargo build --target wasm32-wasip1 --release -p rs-learn" }

features:
  heading: "what's in the box"
  items:
    - { name: "hebbian microlora", desc: "rank-2 hebbian adapter, norm-bound, lr floor, |scale|-weighted prioritized replay, optional ewc correction.", meta: "learn::instant_core" }
    - { name: "ewc++ consolidation", desc: "online fisher ema (decay 0.999); z-score boundary detection over a sliding loss window.", meta: "learn::deep_core" }
    - { name: "bi-temporal graph", desc: "valid_at/invalid_at/created_at/expired_at edge store; point-in-time query; invalidate-don't-delete contradiction handling.", meta: "graph::temporal_core" }
    - { name: "graph attention", desc: "8-head attention with edge features: relation one-hot, recency decay, weight. per-head softmax weights.", meta: "graph::attention" }
    - { name: "fastgrnn router", desc: "90% sparse + rank-8 low-rank; five heads (model, context bucket, temperature, top_p, confidence); epsilon-greedy exploration.", meta: "router::core" }
    - { name: "single json dispatch surface", desc: "one verb table maps to all five cores; wasm export wires rs_learn_dispatch to a singleton LearnSession backed by the host's kv shim.", meta: "dispatch::LearnSession" }

sections:
  - id: dispatch
    kind: rows
    label: "dispatch // verbs"
    heading: "one json surface, five cores."
    body: "every call is { verb, body } in, { ok, verb, data?, error? } out. the host passes an in-buffer and reads the response from the packed return."
    items:
      - { code: "01", name: "health", sub: "reports core readiness, fisher key count, boundary count.", meta: "{}" }
      - { code: "02", name: "init_instant · feedback · apply_adapter · reset_adapter", sub: "microlora lifecycle: initialize targets, hebbian update on feedback, forward pass, zero-reset.", meta: "instant" }
      - { code: "03", name: "record_loss · consolidate · ewc_penalty", sub: "loss ring + z-score boundary fire, fisher ema update, penalty computation against a params snapshot.", meta: "deep" }
      - { code: "04", name: "init_router · route · record_outcome", sub: "initialize fastgrnn, choose model + sampling params, ema-update per-target quality.", meta: "router" }
      - { code: "05", name: "init_attention · attend", sub: "initialize 8-head attention, compute a multi-head attended context vector over a subgraph.", meta: "attention" }
      - { code: "06", name: "insert_edge · query_at · invalidate_edge · contradict · get_edge", sub: "bi-temporal edge crud plus graphiti-style contradiction handling.", meta: "graph" }

  - id: bitemporal
    kind: quote
    label: "graph // bi-temporal model"
    heading: "contradictions never delete history."
    body: "edges carry four timestamps: valid_at/invalid_at (when the fact held in the world) and created_at/expired_at (when we knew it). a point-in-time query at t returns edges where valid_at <= t < invalid_at. when fact b contradicts fact a starting at t = b.valid_at, we set a.invalid_at = t and a.expired_at = now — a stays queryable for any time before t. the canonical test walks the alice@acme -> alice@globex scenario and witnesses both edges retrievable at their respective historical windows."

  - id: lora
    kind: rows
    label: "learn // hebbian microlora"
    heading: "rank-2 adapter, updated on every feedback call."
    body: "instant_core::InstantCore keeps a rank-2 hebbian adapter (A: 2 x IN, B: 2 x n_targets). feedback(emb, model, {quality}) runs a five-step update."
    items:
      - { code: "01", name: "centered scale", sub: "quality [0,1] maps to scale = (q - 0.5) * 2. neutral feedback (q ~ 0.5) is a no-op.", meta: "" }
      - { code: "02", name: "hebbian update", sub: "updates A and B for the chosen target, scaled by lr * scale.", meta: "" }
      - { code: "03", name: "ewc correction", sub: "delta -= lr * lambda * fisher * (params - snapshot), when consolidation has run.", meta: "optional" }
      - { code: "04", name: "lr decay + floor", sub: "lr decays by 0.995 per step, floored at RS_LEARN_LR_MIN (default 1e-3).", meta: "" }
      - { code: "05", name: "norm clamp + replay", sub: "clamps ||A,B|| to 5.0; buffers (emb, idx, scale) for |scale|-weighted prioritized replay.", meta: "" }

  - id: ci
    kind: rows
    label: "ci // wasm-check + publish"
    heading: "wasm check on every pr, wasm publish on every push to main."
    body: "wasm-check.yml runs cargo check against wasm32-wasip1 plus a native cargo test pass on every pull request. publish.yml builds the release wasm, auto-bumps the crate patch version, publishes the binary to the plugkit-bin github release, and pushes the npm wasm wrapper."
    items:
      - { code: "01", name: "wasm32-wasip1 check", sub: "cargo check --target wasm32-wasip1 --no-default-features --features wasm --lib -p rs-learn", meta: "wasm-check.yml" }
      - { code: "02", name: "native test", sub: "cargo test -p rs-learn — 65 tests covering every dispatch verb and algorithm invariant.", meta: "wasm-check.yml" }
      - { code: "03", name: "release wasm build + publish", sub: "builds release wasm, uploads rs-learn.wasm + sha256 to the plugkit-bin gh release, publishes @anentrypoint/rs-learn-wasm to npm.", meta: "publish.yml" }

  - id: env
    kind: rows
    label: "env // configuration"
    heading: "knobs the algorithm layer reads."
    body: "the crate itself takes no environment configuration beyond the lr floor; everything else (backend selection, agent transport, scheduling) is the host's responsibility."
    items:
      - { code: "RS_LEARN_LR_MIN", name: "instant loop lr floor", sub: "prevents adapter decay freeze. default 1e-3.", meta: "1e-3" }

  - id: footnote
    kind: quote
    label: "footnote // why"
    heading: "the algorithm layer, not the whole agent."
    body: "rs-learn provides lora optimization over time (in the spirit of ruvnet's sona) and a temporal knowledge graph (in the spirit of getzep's graphiti), as a small wasm cdylib any host can embed. it does not own io, scheduling, embedding, or agent transport — that's the host's job."
