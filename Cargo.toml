[package]
name = "rs-learn"
version = "0.1.40"
edition = "2021"
authors = ["AnEntrypoint"]
license = "MIT"
description = "Continual-learning orchestrator (wasm32-wasip1): host-served kv + vector recall via plugkit."
repository = "https://github.com/AnEntrypoint/rs-learn"
homepage = "https://github.com/AnEntrypoint/rs-learn"
readme = "README.md"
keywords = ["wasm", "llm", "memory", "recall", "plugkit"]
categories = ["wasm"]

[lib]
name = "rs_learn"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
