[package]
name = "rs-learn-embed"
version = "0.1.0"
edition = "2021"
authors = ["AnEntrypoint"]
license = "MIT"
description = "Native sidecar producing 768-dim NomicEmbedTextV1.5 embeddings via JSONL stdio protocol."
repository = "https://github.com/AnEntrypoint/rs-learn"

[[bin]]
name = "rs-learn-embed"
path = "src/main.rs"

[dependencies]
fastembed = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
