name: Publish Native (rs-learn-embed)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Leave blank to read crates/embed/Cargo.toml.'
        required: false
        default: ''

concurrency:
  group: publish-native
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -e
          IN="${{ github.event.inputs.version }}"
          if [ -n "$IN" ]; then
            echo "version=$IN" >> "$GITHUB_OUTPUT"
          else
            V=$(grep '^version' crates/embed/Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: win-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bin: rs-learn-embed.exe
            os: win32
            cpu: x64
            cross: false
          - pkg: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: rs-learn-embed
            os: linux
            cpu: x64
            cross: false
          - pkg: linux-arm64
            runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bin: rs-learn-embed
            os: linux
            cpu: arm64
            cross: true
          - pkg: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
            bin: rs-learn-embed
            os: darwin
            cpu: x64
            cross: false
          - pkg: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bin: rs-learn-embed
            os: darwin
            cpu: arm64
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: native-${{ matrix.target }}
          cache-on-failure: true

      - name: Install cross (linux-arm64 only)
        if: matrix.cross == true
        shell: bash
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.cross == false
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p rs-learn-embed

      - name: Build (cross)
        if: matrix.cross == true
        shell: bash
        run: cross build --release --target ${{ matrix.target }} -p rs-learn-embed

      - name: Stage package
        shell: bash
        env:
          VER: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -e
          mkdir -p npm-pkg/bin
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "npm-pkg/bin/${{ matrix.bin }}"
          cat > npm-pkg/package.json <<EOF
          {
            "name": "@anentrypoint/rs-learn-embed-${{ matrix.pkg }}",
            "version": "$VER",
            "description": "rs-learn-embed native binary for ${{ matrix.pkg }}",
            "os": ["${{ matrix.os }}"],
            "cpu": ["${{ matrix.cpu }}"],
            "files": ["bin/"],
            "repository": {
              "type": "git",
              "url": "https://github.com/AnEntrypoint/rs-learn.git"
            },
            "license": "MIT",
            "author": "AnEntrypoint"
          }
          EOF
          cat > npm-pkg/README.md <<EOF
          # @anentrypoint/rs-learn-embed-${{ matrix.pkg }}

          Native binary of \`rs-learn-embed\` for ${{ matrix.os }}/${{ matrix.cpu }}.

          Do not install directly. Install \`@anentrypoint/rs-learn-embed\`, which selects the correct platform binary via optionalDependencies.
          EOF

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-pkg-${{ matrix.pkg }}
          path: npm-pkg/

  publish:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: pkgs/

      - name: Publish per-platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VER: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -e
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set; skipping publish"
            exit 0
          fi
          for d in pkgs/npm-pkg-*/; do
            NAME=$(node -p "require('$PWD/$d/package.json').name")
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "$NAME@$VER already published, skipping"
              continue
            fi
            (cd "$d" && npm publish --access public)
          done

      - name: Publish meta-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VER: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -e
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set; skipping meta publish"
            exit 0
          fi
          mkdir -p meta
          cat > meta/package.json <<EOF
          {
            "name": "@anentrypoint/rs-learn-embed",
            "version": "$VER",
            "description": "rs-learn-embed: 768-dim NomicEmbedTextV1.5 native sidecar (platform-selecting meta-package).",
            "repository": {
              "type": "git",
              "url": "https://github.com/AnEntrypoint/rs-learn.git"
            },
            "license": "MIT",
            "author": "AnEntrypoint",
            "optionalDependencies": {
              "@anentrypoint/rs-learn-embed-win-x64": "$VER",
              "@anentrypoint/rs-learn-embed-linux-x64": "$VER",
              "@anentrypoint/rs-learn-embed-linux-arm64": "$VER",
              "@anentrypoint/rs-learn-embed-macos-x64": "$VER",
              "@anentrypoint/rs-learn-embed-macos-arm64": "$VER"
            }
          }
          EOF
          cat > meta/README.md <<'EOF'
          # @anentrypoint/rs-learn-embed

          Platform-selecting meta-package for the `rs-learn-embed` native sidecar.

          Install this package; npm will install only the platform-matching optional dependency
          (`@anentrypoint/rs-learn-embed-<os>-<cpu>`). The binary lives at
          `node_modules/@anentrypoint/rs-learn-embed-<os>-<cpu>/bin/rs-learn-embed[.exe]`.

          Resolution helper (in consumer code):

          ```js
          const path = require('path');
          const plat = process.platform === 'win32' ? 'win'
                    : process.platform === 'darwin' ? 'macos' : 'linux';
          const arch = process.arch === 'arm64' ? 'arm64' : 'x64';
          const exe = process.platform === 'win32' ? 'rs-learn-embed.exe' : 'rs-learn-embed';
          const pkg = `@anentrypoint/rs-learn-embed-${plat}-${arch}`;
          const binPath = path.join(require.resolve(`${pkg}/package.json`), '..', 'bin', exe);
          ```
          EOF
          if npm view "@anentrypoint/rs-learn-embed@$VER" version >/dev/null 2>&1; then
            echo "meta @ $VER already published"
            exit 0
          fi
          (cd meta && npm publish --access public)
