name: Publish

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: release-wasm32-wasip1
          cache-on-failure: true

      - name: Build WASM
        run: cargo build --release --target wasm32-wasip1 --no-default-features --features wasm --lib

      - name: Rename WASM binary
        shell: bash
        run: cp target/wasm32-wasip1/release/rs_learn.wasm rs-learn.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-learn.wasm
          path: rs-learn.wasm

  publish-binaries:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Auto-bump rs-learn patch version
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          git config user.name "gm-bot"
          git config user.email "noreply@github.com"
          git config url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" Cargo.toml
          git add Cargo.toml
          if git diff --cached --quiet; then
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git fetch origin main
            git rebase -s recursive -X theirs origin/main
            git push origin HEAD:main
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          path: bins/

      - name: Stage release assets
        shell: bash
        env:
          VER: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          mkdir -p release-assets
          cp bins/rs-learn.wasm/rs-learn.wasm release-assets/
          cd release-assets
          sha256sum rs-learn.wasm | sed 's/ \*/  /' > rs-learn.wasm.sha256
          echo "$VER" > rs-learn.wasm.version

      - name: Upload to plugkit-bin Release
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          VER: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          if ! gh release view "rs-learn-v$VER" --repo AnEntrypoint/plugkit-bin >/dev/null 2>&1; then
            gh release create "rs-learn-v$VER" \
              --repo AnEntrypoint/plugkit-bin \
              --title "rs-learn v$VER (WASM)" \
              --notes "Auto-published WASM-only build from rs-learn CI at $GITHUB_SHA"
          fi
          gh release upload "rs-learn-v$VER" \
            --repo AnEntrypoint/plugkit-bin \
            --clobber \
            release-assets/rs-learn.wasm \
            release-assets/rs-learn.wasm.sha256 \
            release-assets/rs-learn.wasm.version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Create npm package structure
        env:
          VER: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          mkdir -p npm-pkg
          cat > npm-pkg/package.json <<EOF
          {
            "name": "@anentrypoint/rs-learn-wasm",
            "version": "$VER",
            "description": "WASM distribution of rs-learn continual-learning recall/memorize",
            "main": "rs-learn.wasm",
            "types": "rs-learn.d.ts",
            "repository": {
              "type": "git",
              "url": "https://github.com/AnEntrypoint/rs-learn.git"
            },
            "keywords": ["rs-learn", "wasm", "gm", "memory", "recall"],
            "author": "AnEntrypoint",
            "license": "MIT",
            "engines": { "node": ">=18.0.0" }
          }
          EOF
          cp release-assets/rs-learn.wasm npm-pkg/
          cp release-assets/rs-learn.wasm.sha256 npm-pkg/
          cat > npm-pkg/rs-learn.d.ts <<'EOF'
          declare const rsLearnWasm: WebAssembly.Module;
          export = rsLearnWasm;
          EOF

      - name: Publish to npm
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VER: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN not set; skipping"
            exit 0
          fi
          cd npm-pkg
          if npm view "@anentrypoint/rs-learn-wasm@$VER" version >/dev/null 2>&1; then
            echo "already published"
            exit 0
          fi
          npm publish --access public
